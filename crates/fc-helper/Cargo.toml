[package]
name = "fc-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Fast Copy elevated helper (drive formatting, VSS snapshots)"

# No unit tests here; the test harness would inherit the requireAdministrator manifest
# (UAC prompt / os error 740 when `cargo test --workspace` runs unelevated).
[[bin]]
name = "fc-helper"
path = "src/main.rs"
test = false

[dependencies]
serde_json.workspace = true

# Formatting and VSS snapshots are Windows-only; on macOS the helper only reports "unsupported".
[target.'cfg(windows)'.dependencies]
fc-core.workspace = true

[build-dependencies]
