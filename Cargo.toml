[workspace]
resolver = "2"
members = ["crates/fc-core", "crates/fc-cli", "crates/fc-helper", "crates/fc-shellext-win", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Fast Copy contributors"]
repository = "https://github.com/andriantenaina/Fast-Copy"
homepage = "https://github.com/andriantenaina/Fast-Copy"
rust-version = "1.80"

[workspace.dependencies]
fc-core = { path = "crates/fc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
crossbeam-channel = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
walkdir = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
dirs = "6"
libc = "0.2"
reflink-copy = "0.1"
plist = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_Security", "Win32_System_Threading", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Com",
  "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_WindowsProgramming",
  "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
