name: Release

# Push a tag "vX.Y.Z" -> builds everything and creates a DRAFT GitHub Release with:
#   * CLI zips (fcopy + fc-helper): windows-x64, windows-arm64, macos-universal
#   * GUI installers: Windows NSIS (-setup.exe) + MSI (x64), macOS universal DMG
#   * FastCopy.msix (sparse package for the Windows 11 context menu, also bundled in the installers)
#   * SHA256SUMS, rendered winget manifests and Homebrew cask
#
# Optional signing (each block is skipped when its secrets are absent):
#   macOS   : secrets APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#             notarization: APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   Windows : secrets WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD
#             or Azure Trusted Signing: secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and
#             repository variables AZURE_TS_ENDPOINT (e.g. https://weu.codesigning.azure.net),
#             AZURE_TS_ACCOUNT, AZURE_TS_PROFILE, AZURE_TS_PUBLISHER (exact certificate subject, for the MSIX)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), for test runs; the release is still a draft"
        required: true
        default: "0.0.0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TIMESTAMP_URL: http://timestamp.digicert.com

jobs:
  # ------------------------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------
  cli-windows:
    name: CLI windows-${{ matrix.arch }}
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build fcopy + fc-helper
        run: cargo build --release --locked --target ${{ matrix.target }} -p fc-cli -p fc-helper

      - name: Sign binaries (PFX)
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $dir = "target/${{ matrix.target }}/release"
          & $st.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 "$dir/fcopy.exe" "$dir/fc-helper.exe"
          Remove-Item $pfx

      - name: Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$dir/fcopy.exe", "$dir/fc-helper.exe" -DestinationPath "dist/fast-copy-cli-$env:VERSION-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  cli-macos:
    name: CLI macos-universal
    needs: meta
    runs-on: macos-15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-macos

      - name: Build both architectures
        run: |
          cargo build --release --locked --target x86_64-apple-darwin -p fc-cli -p fc-helper
          cargo build --release --locked --target aarch64-apple-darwin -p fc-cli -p fc-helper

      - name: lipo -> universal
        run: |
          mkdir -p universal
          for b in fcopy fc-helper; do
            lipo -create -output "universal/$b" "target/x86_64-apple-darwin/release/$b" "target/aarch64-apple-darwin/release/$b"
            lipo -info "universal/$b"
          done

      - name: Import signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Codesign (hardened runtime)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for b in fcopy fc-helper; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "universal/$b"
            codesign --verify --verbose "universal/$b"
          done

      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc universal "dist/fast-copy-cli-$VERSION-macos-universal.zip"

      - name: Notarize CLI zip
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Bare executables cannot be stapled; Gatekeeper checks the ticket online.
        run: xcrun notarytool submit "dist/fast-copy-cli-$VERSION-macos-universal.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait

      - uses: actions/upload-artifact@v7
        with:
          name: cli-macos-universal
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  gui-windows:
    name: GUI windows-x64 (NSIS + MSI + sparse package)
    needs: meta
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_AZURE_TS: ${{ secrets.WINDOWS_CERTIFICATE == '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_TS_ACCOUNT != '' }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TS_ENDPOINT: ${{ vars.AZURE_TS_ENDPOINT }}
      AZURE_TS_ACCOUNT: ${{ vars.AZURE_TS_ACCOUNT }}
      AZURE_TS_PROFILE: ${{ vars.AZURE_TS_PROFILE }}
      AZURE_TS_PUBLISHER: ${{ vars.AZURE_TS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-windows
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Import code-signing certificate (PFX)
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          "WIN_CERT_PFX=$pfx" >> $env:GITHUB_ENV
          "WIN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "WIN_CERT_SUBJECT=$($cert.Subject)" >> $env:GITHUB_ENV

      - name: Install trusted-signing-cli (Azure Trusted Signing)
        if: env.HAS_AZURE_TS == 'true'
        run: cargo install trusted-signing-cli --locked

      - name: Build shell extension DLL
        run: cargo build --release --locked -p fc-shellext-win

      - name: Sign shell extension DLL
        if: env.HAS_WIN_CERT == 'true' || env.HAS_AZURE_TS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $dll = 'target/release/fc_shellext_win.dll'
          if ($env:HAS_WIN_CERT -eq 'true') {
            $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $st.FullName sign /fd SHA256 /f $env:WIN_CERT_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 $dll
          } else {
            trusted-signing-cli -e $env:AZURE_TS_ENDPOINT -a $env:AZURE_TS_ACCOUNT -c $env:AZURE_TS_PROFILE -d "Fast Copy" $dll
          }

      - name: Build sparse package FastCopy.msix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          if ($env:HAS_WIN_CERT -eq 'true') {
            ./packaging/windows/build-sparse.ps1 -Version $env:VERSION -Arch x64 -CertPath $env:WIN_CERT_PFX -CertPassword $env:WINDOWS_CERTIFICATE_PASSWORD -Publisher $env:WIN_CERT_SUBJECT -TimestampUrl $env:TIMESTAMP_URL
          } elseif ($env:HAS_AZURE_TS -eq 'true') {
            ./packaging/windows/build-sparse.ps1 -Version $env:VERSION -Arch x64 -NoSign -Publisher $env:AZURE_TS_PUBLISHER
            trusted-signing-cli -e $env:AZURE_TS_ENDPOINT -a $env:AZURE_TS_ACCOUNT -c $env:AZURE_TS_PROFILE -d "Fast Copy" packaging/windows/out/FastCopy.msix
          } else {
            # Unsigned: still bundled; the installer hook fails to register it and the classic menu is used.
            ./packaging/windows/build-sparse.ps1 -Version $env:VERSION -Arch x64 -NoSign
          }

      - name: Generate Tauri CI config (resources, NSIS hooks, signing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $cfg = @{
            bundle = @{
              resources = @{
                "$ws/target/release/fc_shellext_win.dll" = 'fc_shellext_win.dll'
                "$ws/packaging/windows/out/FastCopy.msix" = 'FastCopy.msix'
              }
              windows = @{ nsis = @{ installerHooks = "$ws/packaging/windows/installer-hooks.nsh" } }
            }
          }
          if ($env:HAS_WIN_CERT -eq 'true') {
            $cfg.bundle.windows.certificateThumbprint = $env:WIN_CERT_THUMBPRINT
            $cfg.bundle.windows.digestAlgorithm = 'sha256'
            $cfg.bundle.windows.timestampUrl = $env:TIMESTAMP_URL
          } elseif ($env:HAS_AZURE_TS -eq 'true') {
            $cfg.bundle.windows.signCommand = "trusted-signing-cli -e $env:AZURE_TS_ENDPOINT -a $env:AZURE_TS_ACCOUNT -c $env:AZURE_TS_PROFILE -d FastCopy %1"
          }
          $path = Join-Path $env:RUNNER_TEMP 'tauri.ci.json'
          $cfg | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM $path
          Get-Content $path
          "TAURI_CI_CONFIG=$path" >> $env:GITHUB_ENV

      - name: Build GUI bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          args: --bundles nsis,msi --config ${{ env.TAURI_CI_CONFIG }}

      - name: Collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi | ForEach-Object {
            Copy-Item $_.FullName (Join-Path dist ($_.Name -replace ' ', ''))
          }
          Copy-Item packaging/windows/out/FastCopy.msix "dist/FastCopy-shellext-$env:VERSION-x64.msix"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: gui-windows-x64
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  gui-macos:
    name: GUI macos-universal (DMG)
    needs: meta
    runs-on: macos-15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-macos
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci

      # The sidecar script builds for TAURI_ENV_TARGET_TRIPLE, which is not a real Rust target for
      # universal builds: build both slices here, lipo them, and skip the script in beforeBuildCommand.
      - name: Universal fc-helper sidecar
        run: |
          cargo build --release --locked -p fc-helper --target x86_64-apple-darwin
          cargo build --release --locked -p fc-helper --target aarch64-apple-darwin
          B=app/src-tauri/binaries; mkdir -p "$B"
          cp target/x86_64-apple-darwin/release/fc-helper "$B/fc-helper-x86_64-apple-darwin"
          cp target/aarch64-apple-darwin/release/fc-helper "$B/fc-helper-aarch64-apple-darwin"
          lipo -create -output "$B/fc-helper-universal-apple-darwin" "$B/fc-helper-x86_64-apple-darwin" "$B/fc-helper-aarch64-apple-darwin"
          echo '{"build":{"beforeBuildCommand":"npm run build"}}' > "$RUNNER_TEMP/tauri.ci.json"
          echo "TAURI_CI_CONFIG=$RUNNER_TEMP/tauri.ci.json" >> "$GITHUB_ENV"

      # tauri-action/tauri-cli read these variables; they are exported only when set, because an
      # empty APPLE_CERTIFICATE would make the bundler try (and fail) to import it.
      - name: Signing / notarization environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            {
              echo "APPLE_CERTIFICATE<<__EOF__"; echo "$APPLE_CERTIFICATE"; echo "__EOF__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ "$HAS_NOTARY" = "true" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi
          else
            echo "No Apple certificate: building an unsigned (ad-hoc) DMG."
          fi

      - name: Build GUI bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          args: --target universal-apple-darwin --bundles dmg --config ${{ env.TAURI_CI_CONFIG }}

      - name: Collect
        run: |
          mkdir -p dist
          for f in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            n="$(basename "$f")"; cp "$f" "dist/${n// /}"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: gui-macos-universal
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  release:
    name: Draft GitHub Release
    needs: [meta, cli-windows, cli-macos, gui-windows, gui-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Render winget manifests and Homebrew cask
        run: |
          set -euo pipefail
          sum() { awk -v f="$1" '{ n = $2; sub(/^\*/, "", n) } n == f { print $1 }' dist/SHA256SUMS; }
          NSIS="$(cd dist && ls *-setup.exe | head -n1)"
          DMG="$(cd dist && ls *.dmg | head -n1)"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          out=dist/packaging; mkdir -p "$out/winget"
          render() {
            sed -e "s|{{VERSION}}|$VERSION|g" \
                -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
                -e "s|{{NSIS_URL}}|$BASE/$NSIS|g" \
                -e "s|{{NSIS_SHA256}}|$(sum "$NSIS" | tr a-f A-F)|g" \
                -e "s|{{DMG_NAME}}|$DMG|g" \
                -e "s|{{DMG_SHA256}}|$(sum "$DMG")|g" "$1"
          }
          for f in packaging/winget/*.yaml; do render "$f" > "$out/winget/$(basename "$f")"; done
          render packaging/homebrew/fast-copy.rb > "$out/fast-copy.rb"
          (cd "$out" && tar czf ../fast-copy-packaging-manifests-$VERSION.tar.gz .)
          rm -rf "$out"
          (cd dist && sha256sum fast-copy-packaging-manifests-$VERSION.tar.gz >> SHA256SUMS)

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', env.VERSION) || github.ref_name }}
          name: Fast Copy ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
